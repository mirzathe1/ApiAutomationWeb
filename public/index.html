<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therap API Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* Custom Therap Brand Colors */
            --therap-orange: #F26522; 
            --therap-orange-hover: #D95A1E;
            --bg-light-gray: #F8F9FA;
        }
        
        body {
            background-color: var(--bg-light-gray);
        }

        /* Custom Button & Background Styles */
        .bg-therap { background-color: var(--therap-orange) !important; }
        .text-therap { color: var(--therap-orange) !important; }
        .btn-therap {
            background-color: var(--therap-orange);
            border-color: var(--therap-orange);
            color: white;
            font-weight: 600;
        }
        .btn-therap:hover {
            background-color: var(--therap-orange-hover);
            border-color: var(--therap-orange-hover);
            color: white;
        }

        /* Custom UI Elements */
        .card { border: none; border-radius: 1rem; }
        .card-header { border-top-left-radius: 1rem !important; border-top-right-radius: 1rem !important; }
        
        /* Terminal Box */
        .log-box { 
            height: calc(100vh - 290px); /* Dynamically fills the exact remaining screen space */
            min-height: 400px;
            overflow-y: auto; 
            background: #1E1E1E; 
            color: #4AF626; 
            font-family: 'Courier New', Courier, monospace; 
            border-radius: 0.5rem;
            font-size: 0.9rem;
            padding-bottom: 20px;
        }
        
        .log-entry { 
            margin-bottom: 6px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 6px;
            word-break: break-word; /* Forces long API errors to wrap neatly */
        }
        .log-error { color: #FF5555; }
    </style>
</head>
<body class="p-4">
    
    <div class="container-fluid" style="max-width: 1200px;">
        
        <!-- Header -->
        <div class="row mb-4">
            <div class="col">
                <h2 class="text-therap fw-bold d-flex align-items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-cloud-arrow-up-fill me-2" viewBox="0 0 16 16">
                      <path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2zm2.354 5.146a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2a.5.5 0 0 1 .708 0l2 2z"/>
                    </svg>
                    Therap Automation Hub
                </h2>
                <p class="text-muted">Bulk upload attendance records securely to the Therap API.</p>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- LEFT COLUMN: Control Panel -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-therap text-white py-3">
                        <h5 class="mb-0">Control Panel</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="uploadForm">
                            <div class="mb-4">
                                <label for="excelFile" class="form-label fw-bold">1. Select Data File (.xlsx)</label>
                                <input type="file" id="excelFile" class="form-control rounded-pill" accept=".xlsx" required>
                            </div>
                            
                            <hr class="mb-4">
                            
                            <label class="form-label fw-bold">2. Execute Action</label>
                            <!-- Pill Shaped Buttons -->
                            <button type="submit" class="btn btn-therap btn-lg rounded-pill w-100 mb-3 shadow-sm" id="runBtn">
                                ▶ Run Automation
                            </button>
                            <button type="button" class="btn btn-outline-secondary rounded-pill w-100" id="clearFormBtn">
                                Clear File
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Output Terminal -->
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Live Execution Logs</h5>
                        <div>
                            <!-- Extra utility buttons -->
                            <button class="btn btn-sm btn-outline-light rounded-pill me-2" id="copyLogsBtn">📋 Copy</button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill" id="clearLogsBtn">🗑 Clear</button>
                        </div>
                    </div>
                    <div class="card-body p-4 bg-white">
                        
                        <!-- Status Badges -->
                        <div class="d-flex justify-content-start mb-3">
                            <span class="badge bg-success rounded-pill px-3 py-2 fs-6 me-2 shadow-sm" id="passCount">Passed: 0</span>
                            <span class="badge bg-danger rounded-pill px-3 py-2 fs-6 shadow-sm" id="failCount">Failed: 0</span>
                        </div>
                        
                        <!-- The Terminal -->
                        <div class="log-box p-3 shadow-inner" id="logBox">
                            <div class="text-muted fst-italic">Waiting for automation to start...</div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('excelFile');
        const runBtn = document.getElementById('runBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const copyLogsBtn = document.getElementById('copyLogsBtn');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const logBox = document.getElementById('logBox');
        
        let totalPassed = 0;
        let totalFailed = 0;

        // --- Execute Automation ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            runBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';
            runBtn.disabled = true;
            fileInput.disabled = true;
            
            // Clear placeholder text if it's the first run
            if(logBox.innerText.includes('Waiting')) logBox.innerHTML = '';

            addLog("[SYSTEM] Uploading file to server...", false);

            const formData = new FormData();
            formData.append('excelFile', fileInput.files[0]);

            try {
                const response = await fetch('/api/run-automation', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Server error');

                // Update Counters
                totalPassed += data.passed;
                totalFailed += data.failed;
                document.getElementById('passCount').innerText = `Passed: ${totalPassed}`;
                document.getElementById('failCount').innerText = `Failed: ${totalFailed}`;
                
                // Print logs
                data.logs.forEach(log => {
                    const isError = log.includes('❌') || log.includes('FAILED');
                    addLog(log, isError);
                });

                addLog(`[SYSTEM] Batch finished.`, false);

            } catch (error) {
                addLog(`[CRITICAL ERROR] ${error.message}`, true);
                alert('Execution failed. Check logs.');
            } finally {
                // Reset Button
                runBtn.innerHTML = '▶ Run Automation';
                runBtn.disabled = false;
                fileInput.disabled = false;
                fileInput.value = ''; // clear the file input automatically after run
            }
        });

        // --- Helper function to append logs with smooth scroll ---
        function addLog(text, isError) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            if (isError) div.classList.add('log-error');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logBox.appendChild(div);
            
            // Modern scroll: Smoothly scrolls ONLY the inner box to the new text
            setTimeout(() => {
                div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 10);
        }

        // --- Button: Clear Form ---
        clearFormBtn.addEventListener('click', () => {
            fileInput.value = '';
        });

        // --- Button: Clear Logs ---
        clearLogsBtn.addEventListener('click', () => {
            logBox.innerHTML = '<div class="text-muted fst-italic">Waiting for automation to start...</div>';
            totalPassed = 0;
            totalFailed = 0;
            document.getElementById('passCount').innerText = `Passed: 0`;
            document.getElementById('failCount').innerText = `Failed: 0`;
        });

        // --- Button: Copy Logs ---
        copyLogsBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(logBox.innerText).then(() => {
                const originalText = copyLogsBtn.innerText;
                copyLogsBtn.innerText = '✅ Copied!';
                setTimeout(() => copyLogsBtn.innerText = originalText, 2000);
            });
        });
    </script>
</body>
</html>
