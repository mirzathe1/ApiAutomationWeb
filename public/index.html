<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therap API Dashboard</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        therap: {
                            DEFAULT: '#F26522',
                            hover: '#D95A1E',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Terminal Box Custom Styles */
        .log-entry { 
            margin-bottom: 6px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 6px;
            word-break: break-word; 
        }
        .log-error { color: #FF5555; }
        
        /* Custom File Input Styling for Dark Mode */
        input[type="file"]::file-selector-button {
            border: none;
            background: #F26522;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
            margin-right: 12px;
        }
        input[type="file"]::file-selector-button:hover {
            background: #D95A1E;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 p-4 md:p-8 font-sans min-h-screen selection:bg-therap selection:text-white">
    
    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-white flex items-center gap-3">
                <i data-lucide="cloud-upload" class="w-8 h-8 text-therap"></i>
                Therap Automation Hub
            </h2>
            <p class="text-slate-400 mt-1 font-medium">Bulk upload attendance records securely to the Therap API.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- LEFT COLUMN: Control Panel -->
            <div class="lg:col-span-1">
                <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden h-full flex flex-col">
                    <div class="bg-therap text-white px-6 py-4 flex items-center gap-2">
                        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                        <h5 class="font-bold text-lg m-0">Control Panel</h5>
                    </div>
                    
                    <div class="p-6 flex-1">
                        <form id="uploadForm">
                            <div class="mb-6">
                                <label for="excelFile" class="block font-bold text-sm text-slate-300 mb-2">1. Select Data File (.xlsx)</label>
                                <input type="file" id="excelFile" class="block w-full text-sm text-slate-400 bg-slate-900 border border-slate-700 rounded-full cursor-pointer focus:outline-none focus:border-therap focus:ring-1 focus:ring-therap" accept=".xlsx" required>
                            </div>
                            
                            <hr class="border-slate-700 mb-6">
                            
                            <label class="block font-bold text-sm text-slate-300 mb-3">2. Execute Action</label>
                            
                            <!-- Action Buttons -->
                            <button type="submit" class="w-full bg-therap hover:bg-therap-hover text-white rounded-full py-3 px-4 flex justify-center items-center gap-2 font-bold shadow-md transition-all duration-200 mb-3" id="runBtn">
                                <i data-lucide="play" class="w-5 h-5" id="runIcon"></i> 
                                <span id="runText">Run Automation</span>
                            </button>
                            
                            <button type="button" class="w-full bg-transparent border-2 border-slate-600 hover:border-slate-500 hover:bg-slate-700 text-slate-300 rounded-full py-2.5 px-4 flex justify-center items-center gap-2 font-semibold transition-all duration-200" id="clearFormBtn">
                                <i data-lucide="eraser" class="w-4 h-4"></i> Clear File
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Output Terminal -->
            <div class="lg:col-span-2">
                <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden h-full flex flex-col">
                    
                    <!-- Terminal Header -->
                    <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center border-b border-slate-800">
                        <h5 class="font-bold text-lg m-0 flex items-center gap-2">
                            <i data-lucide="terminal" class="w-5 h-5 text-slate-400"></i>
                            Live Execution Logs
                        </h5>
                        <div class="flex gap-2">
                            <button class="flex items-center gap-1.5 text-xs border border-slate-600 text-slate-300 rounded-full px-3 py-1.5 hover:bg-slate-700 hover:text-white transition-colors" id="copyLogsBtn">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy
                            </button>
                            <button class="flex items-center gap-1.5 text-xs border border-red-900/50 text-red-400 rounded-full px-3 py-1.5 hover:bg-red-900/30 hover:text-red-300 transition-colors" id="clearLogsBtn">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear
                            </button>
                        </div>
                    </div>

                    <!-- Terminal Body -->
                    <div class="p-6 bg-slate-800 flex-1 flex flex-col">
                        
                        <!-- Status Badges -->
                        <div class="flex gap-3 mb-4">
                            <span class="inline-flex items-center gap-1.5 bg-emerald-900/40 text-emerald-400 px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-800" id="passBadge">
                                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                <span id="passCount">Passed: 0</span>
                            </span>
                            <span class="inline-flex items-center gap-1.5 bg-red-900/40 text-red-400 px-4 py-1.5 rounded-full text-sm font-bold border border-red-800" id="failBadge">
                                <i data-lucide="x-circle" class="w-4 h-4"></i>
                                <span id="failCount">Failed: 0</span>
                            </span>
                        </div>
                        
                        <!-- The Terminal Box -->
                        <div class="h-[calc(100vh-320px)] min-h-[400px] overflow-y-auto bg-black text-[#4AF626] font-mono rounded-xl p-4 text-sm shadow-inner pb-8 w-full border border-slate-900" id="logBox">
                            <div class="text-slate-500 italic flex items-center gap-2">
                                <i data-lucide="clock" class="w-4 h-4"></i>
                                Waiting for automation to start...
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Initialize Lucide Icons immediately
        lucide.createIcons();

        // --- DOM Elements ---
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('excelFile');
        const runBtn = document.getElementById('runBtn');
        const runText = document.getElementById('runText');
        const runIcon = document.getElementById('runIcon');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const copyLogsBtn = document.getElementById('copyLogsBtn');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const logBox = document.getElementById('logBox');
        
        let totalPassed = 0;
        let totalFailed = 0;

        // --- Execute Automation ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            runBtn.disabled = true;
            runBtn.classList.add('opacity-75', 'cursor-not-allowed');
            fileInput.disabled = true;
            
            // Swap to loading icon
            runIcon.setAttribute('data-lucide', 'loader-circle');
            runIcon.classList.add('animate-spin');
            runText.innerText = 'Processing...';
            lucide.createIcons();
            
            // Clear placeholder text if it's the first run
            if(logBox.innerText.includes('Waiting')) logBox.innerHTML = '';

            addLog("[SYSTEM] Uploading file to server...", false);

            const formData = new FormData();
            formData.append('excelFile', fileInput.files[0]);

            try {
                const response = await fetch('/api/run-automation', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Server error');

                // Update Counters
                totalPassed += data.passed;
                totalFailed += data.failed;
                document.getElementById('passCount').innerText = `Passed: ${totalPassed}`;
                document.getElementById('failCount').innerText = `Failed: ${totalFailed}`;
                
                // Print logs
                data.logs.forEach(log => {
                    const isError = log.includes('❌') || log.includes('FAILED');
                    addLog(log, isError);
                });

                addLog(`[SYSTEM] Batch finished.`, false);

            } catch (error) {
                addLog(`[CRITICAL ERROR] ${error.message}`, true);
                alert('Execution failed. Check logs.');
            } finally {
                // Reset Button
                runBtn.disabled = false;
                runBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                fileInput.disabled = false;
                fileInput.value = ''; 
                
                // Swap back to play icon
                runIcon.setAttribute('data-lucide', 'play');
                runIcon.classList.remove('animate-spin');
                runText.innerText = 'Run Automation';
                lucide.createIcons();
            }
        });

        // --- Helper function to append logs with smooth scroll ---
        function addLog(text, isError) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            if (isError) div.classList.add('log-error');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logBox.appendChild(div);
            
            setTimeout(() => {
                div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 10);
        }

        // --- Button: Clear Form ---
        clearFormBtn.addEventListener('click', () => {
            fileInput.value = '';
        });

        // --- Button: Clear Logs ---
        clearLogsBtn.addEventListener('click', () => {
            logBox.innerHTML = `
                <div class="text-slate-500 italic flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    Waiting for automation to start...
                </div>
            `;
            lucide.createIcons();
            totalPassed = 0;
            totalFailed = 0;
            document.getElementById('passCount').innerText = `Passed: 0`;
            document.getElementById('failCount').innerText = `Failed: 0`;
        });

        // --- Button: Copy Logs ---
        copyLogsBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(logBox.innerText).then(() => {
                const originalHtml = copyLogsBtn.innerHTML;
                copyLogsBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> Copied!';
                lucide.createIcons();
                setTimeout(() => {
                    copyLogsBtn.innerHTML = originalHtml;
                    lucide.createIcons();
                }, 2000);
            });
        });
    </script>
</body>
</html>
