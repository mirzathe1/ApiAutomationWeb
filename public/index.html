<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therap API Integration Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for JSON blocks */
        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-track { background: #0f172a; }
        pre::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        pre::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-[#0B1120] text-slate-300 font-sans min-h-screen p-6 selection:bg-indigo-500 selection:text-white">

    <div class="max-w-[1400px] mx-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-900/50 p-2.5 rounded-lg border border-indigo-500/30">
                    <i data-lucide="chevron-right" class="w-6 h-6 text-indigo-400"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Therap API Integration Suite</h1>
                    <p class="text-sm text-slate-500">All-in-One Auth & Attendance Data Interface</p>
                </div>
            </div>
            <div class="bg-emerald-900/30 text-emerald-400 border border-emerald-800 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 shadow-sm">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                Proxy Connected
            </div>
        </div>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
            
            <!-- LEFT COLUMN: Forms -->
            <div class="xl:col-span-5 space-y-6">
                
                <!-- STEP 1: AUTHENTICATION -->
                <div class="bg-[#111827] border border-slate-800 rounded-xl p-5 shadow-lg">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-sm font-bold text-slate-300 flex items-center gap-2 tracking-widest">
                            <i data-lucide="key" class="w-4 h-4 text-indigo-400"></i> STEP 1: GENERATE TOKEN
                        </h2>
                        <span id="tokenStatus" class="bg-slate-800 text-slate-400 text-[10px] px-2 py-1 rounded font-bold tracking-wider">TOKEN INACTIVE</span>
                    </div>

                    <form id="authForm" class="space-y-4">
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Login Name</label>
                                <input type="text" id="loginName" required class="w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Provider Code</label>
                                <input type="text" id="providerCode" required class="w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Password</label>
                                <input type="password" id="password" required class="w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                            </div>
                        </div>
                        <button type="submit" id="authBtn" class="w-full bg-[#1E293B] hover:bg-slate-700 text-slate-300 border border-slate-600 rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-2 transition-all">
                            <i data-lucide="lock" class="w-4 h-4"></i> Generate & Active Bearer Token
                        </button>
                    </form>
                </div>

                <!-- STEP 2: INPUT DATA -->
                <div class="bg-[#111827] border border-slate-800 rounded-xl p-5 shadow-lg opacity-50 pointer-events-none transition-opacity duration-300" id="step2Panel">
                    <h2 class="text-sm font-bold text-slate-300 flex items-center gap-2 tracking-widest mb-5">
                        <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> STEP 2: INPUT ATTENDANCE DATA
                    </h2>

                    <form id="payloadForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Service Form ID <span class="text-red-500">*</span></label>
                                <input type="text" id="serviceFormId" class="payload-input w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Option Code <span class="text-red-500">*</span></label>
                                <input type="text" id="optionCode" placeholder="e.g. P" class="payload-input w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Service Date <span class="text-red-500">*</span></label>
                                <input type="text" id="serviceDate" placeholder="MM/DD/YYYY" class="payload-input w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Time In</label>
                                    <input type="text" id="timeIn" placeholder="10:30 AM" class="payload-input w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Time Out</label>
                                    <input type="text" id="timeOut" placeholder="11:30 AM" class="payload-input w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase">Comments</label>
                            <textarea id="comments" rows="2" class="payload-input w-full bg-[#0B1120] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg py-3 text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20 transition-all">
                            <i data-lucide="send" class="w-4 h-4"></i> Generate & Submit POST Request
                        </button>
                    </form>
                </div>
            </div>

            <!-- RIGHT COLUMN: JSON Displays -->
            <div class="xl:col-span-7 space-y-6">
                
                <!-- JSON Preview Box -->
                <div class="bg-[#111827] border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col h-[320px]">
                    <div class="flex justify-between items-center bg-[#0f172a] px-4 py-3 border-b border-slate-800">
                        <h2 class="text-xs font-bold text-slate-400 flex items-center gap-2 tracking-widest">
                            <i data-lucide="code-2" class="w-4 h-4"></i> GENERATED REQUEST PAYLOAD
                        </h2>
                        <span class="text-[10px] font-bold bg-slate-800 text-slate-400 px-2 py-0.5 rounded">JSON</span>
                    </div>
                    <div class="p-4 flex-1 overflow-auto bg-[#0B1120]">
                        <pre id="payloadPreview" class="text-emerald-400 text-[13px] font-mono leading-relaxed">{}</pre>
                    </div>
                </div>

                <!-- API Response Box -->
                <div class="bg-[#111827] border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col h-[320px]">
                    <div class="flex justify-between items-center bg-[#0f172a] px-4 py-3 border-b border-slate-800">
                        <h2 class="text-xs font-bold text-slate-400 flex items-center gap-2 tracking-widest">
                            <i data-lucide="server" class="w-4 h-4"></i> RESPONSE OUTPUT LOG
                        </h2>
                        <span id="responseStatus" class="text-[10px] font-bold bg-slate-800 text-slate-500 px-2 py-0.5 rounded">WAITING</span>
                    </div>
                    <div class="p-4 flex-1 overflow-auto bg-[#0B1120]">
                        <pre id="responseLog" class="text-slate-500 text-[13px] font-mono leading-relaxed">// Submit request to view response...</pre>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // DOM Elements
        const authForm = document.getElementById('authForm');
        const authBtn = document.getElementById('authBtn');
        const tokenStatus = document.getElementById('tokenStatus');
        const step2Panel = document.getElementById('step2Panel');
        
        const payloadForm = document.getElementById('payloadForm');
        const submitBtn = document.getElementById('submitBtn');
        const payloadPreview = document.getElementById('payloadPreview');
        const responseLog = document.getElementById('responseLog');
        const responseStatus = document.getElementById('responseStatus');

        // --- Live JSON Preview Logic ---
        function generatePayloadObject() {
            // Build the specific JSON structure Therap expects for Attendance
            return {
                serviceFormId: document.getElementById('serviceFormId').value || "",
                serviceDate: document.getElementById('serviceDate').value || "",
                optionCode: document.getElementById('optionCode').value || "",
                timeInOut: [{
                    timeIn: document.getElementById('timeIn').value || "",
                    timeOut: document.getElementById('timeOut').value || "",
                    billable: true,
                    serviceType: 0
                }],
                comments: document.getElementById('comments').value || ""
            };
        }

        function updateLivePreview() {
            const payload = generatePayloadObject();
            payloadPreview.textContent = JSON.stringify(payload, null, 2);
        }

        // Attach event listeners to all inputs in Step 2 so it updates as you type
        document.querySelectorAll('.payload-input').forEach(input => {
            input.addEventListener('input', updateLivePreview);
        });

        // Initialize preview on page load
        updateLivePreview();

        // --- Step 1: Authentication ---
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Authenticating...';
            lucide.createIcons();
            authBtn.disabled = true;

            const credentials = {
                loginName: document.getElementById('loginName').value,
                providerCode: document.getElementById('providerCode').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });

                if (!res.ok) throw new Error("Login failed");

                // Success UI changes
                tokenStatus.textContent = "TOKEN ACTIVE";
                tokenStatus.className = "bg-emerald-900/30 text-emerald-400 text-[10px] px-2 py-1 rounded font-bold tracking-wider border border-emerald-800";
                
                authBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Authenticated';
                authBtn.classList.replace('text-slate-300', 'text-emerald-400');
                
                // Unlock Step 2
                step2Panel.classList.remove('opacity-50', 'pointer-events-none');
                
            } catch (err) {
                alert(err.message);
                authBtn.innerHTML = '<i data-lucide="lock" class="w-4 h-4"></i> Generate & Active Bearer Token';
                authBtn.disabled = false;
            }
            lucide.createIcons();
        });

        // --- Step 2: Submit Payload ---
        payloadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Submitting...';
            lucide.createIcons();
            submitBtn.disabled = true;

            const payload = generatePayloadObject();
            
            // Reset Response Box
            responseLog.textContent = "Waiting for server...";
            responseLog.className = "text-slate-400 text-[13px] font-mono leading-relaxed";
            responseStatus.textContent = "SENDING...";
            responseStatus.className = "text-[10px] font-bold bg-indigo-900/50 text-indigo-400 border border-indigo-800 px-2 py-0.5 rounded";

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                // Print output exactly as received
                responseLog.textContent = JSON.stringify(data, null, 2);

                // Style based on success vs error (e.g., HTTP 422 Error)
                if (res.ok) {
                    responseLog.classList.replace('text-slate-400', 'text-emerald-400');
                    responseStatus.textContent = `HTTP ${res.status} SUCCESS`;
                    responseStatus.className = "text-[10px] font-bold bg-emerald-900/30 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded";
                } else {
                    responseLog.classList.replace('text-slate-400', 'text-red-400');
                    responseStatus.textContent = `HTTP ${res.status} ERROR`;
                    responseStatus.className = "text-[10px] font-bold bg-red-900/30 text-red-400 border border-red-800 px-2 py-0.5 rounded";
                }

            } catch (err) {
                responseLog.textContent = err.message;
                responseLog.classList.replace('text-slate-400', 'text-red-400');
            } finally {
                submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Generate & Submit POST Request';
                submitBtn.disabled = false;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
