<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therap API Integration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for terminals */
        pre::-webkit-scrollbar { width: 6px; height: 6px; }
        pre::-webkit-scrollbar-track { background: #1e293b; }
        pre::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        pre::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-[#F0F2F5] text-gray-800 font-sans min-h-screen overflow-x-hidden selection:bg-[#00508F] selection:text-white">

    <!-- TOP NAVBAR (Therap Yellow) -->
    <header class="bg-[#FDBA12] h-[60px] flex items-center justify-between px-6 shadow-sm border-b border-yellow-600">
        <div class="flex items-center gap-8">
            <h1 class="text-3xl font-extrabold text-[#00508F] italic tracking-tighter" style="font-family: Arial, sans-serif;">
                Therap<sup class="text-sm font-bold">&reg;</sup>
            </h1>
            <span class="text-gray-900 font-semibold tracking-wide hidden md:block">API Integration Suite</span>
        </div>
        
        
        <div class="flex items-center gap-6 text-gray-900 font-semibold text-sm">
            <div class="flex items-center gap-2">
                <i data-lucide="user" class="w-4 h-4 fill-current"></i> 
                Mirza (MIR-NY)
            </div>
            <!-- THE FIX: Added logoutBtn ID here -->
            <div id="logoutBtn" class="flex items-center gap-2 cursor-pointer hover:text-[#00508F] transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </div>
        </div>
    </header>

    <!-- MAIN LAYOUT GRID -->
    <div class="max-w-[1800px] mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        
        <!-- LEFT SIDEBAR -->
        <div class="lg:col-span-2 bg-white rounded shadow-sm border border-gray-200 overflow-hidden hidden lg:block">
            <div class="bg-[#E6EAF6] text-[#00508F] text-center font-bold py-2 border-b border-gray-200">
                Tabs
            </div>
            <nav class="flex flex-col py-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-[#E6F0FA] text-[#00508F] font-bold border-l-4 border-[#00508F]">
                    <i data-lucide="list-todo" class="w-5 h-5"></i> Automation
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-[#00508F] font-semibold hover:bg-gray-50 transition-colors">
                    <i data-lucide="user" class="w-5 h-5"></i> Individual
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-[#00508F] font-semibold hover:bg-gray-50 transition-colors">
                    <i data-lucide="line-chart" class="w-5 h-5"></i> Reporting
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-[#00508F] font-semibold hover:bg-gray-50 transition-colors">
                    <i data-lucide="dollar-sign" class="w-5 h-5"></i> Billing
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-[#00508F] font-semibold hover:bg-gray-50 transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i> Admin
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-[#00508F] font-semibold hover:bg-gray-50 transition-colors">
                    <i data-lucide="settings" class="w-5 h-5"></i> Settings
                </a>
            </nav>
        </div>

        <!-- CENTER: Forms -->
        <div class="lg:col-span-6 space-y-5">
            
            <!-- STEP 1: AUTHENTICATION -->
            <div class="bg-white rounded shadow-sm border border-gray-200 p-5">
                <div class="flex justify-between items-end border-b-2 border-[#00508F] pb-2 mb-5">
                    <h2 class="text-[#00508F] text-xl font-bold flex items-center gap-2">
                        <i data-lucide="key" class="w-5 h-5 text-yellow-500"></i> Token Generation
                    </h2>
                    <span id="tokenStatus" class="text-xs font-bold text-gray-400 uppercase tracking-wider">Status: Inactive</span>
                </div>

                <form id="authForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Login Name</label>
                            <input type="text" id="loginName" required class="w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Provider Code</label>
                            <input type="text" id="providerCode" required class="w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                        <div class="relative">
                            <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
                            <input type="password" id="password" required class="w-full bg-white border border-gray-300 rounded-sm pl-3 pr-8 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                            <button type="button" id="togglePasswordBtn" class="absolute right-2 top-[22px] text-gray-500 hover:text-[#00508F]">
                                <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" id="authBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 rounded-sm py-2 px-4 text-sm font-bold flex items-center justify-center gap-2 transition-colors w-[200px]">
                        <i data-lucide="lock" class="w-4 h-4"></i> Authenticate API
                    </button>
                </form>
            </div>

            <!-- STEP 2: INPUT DATA -->
            <div class="bg-white rounded shadow-sm border border-gray-200 p-5 opacity-50 pointer-events-none transition-opacity duration-300" id="step2Panel">
                <div class="flex justify-between items-end border-b-2 border-green-600 pb-2 mb-5">
                    <h2 class="text-[#00508F] text-xl font-bold flex items-center gap-2">
                        <i data-lucide="layout-template" class="w-5 h-5 text-green-600"></i> Attendance Data Input
                    </h2>
                </div>

                <form id="payloadForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Service Form ID <span class="text-red-500">*</span></label>
                            <input type="text" id="serviceFormId" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Option Code <span class="text-red-500">*</span></label>
                            <input type="text" id="optionCode" placeholder="e.g. P" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Service Date (Start) <span class="text-red-500">*</span></label>
                            <input type="text" id="serviceDate" placeholder="MM/DD/YYYY" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Service Date (End) <span class="text-gray-400 font-normal text-[10px]">(Optional Bulk)</span></label>
                            <input type="text" id="serviceDateEnd" placeholder="MM/DD/YYYY" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Time In</label>
                            <input type="text" id="timeIn" placeholder="10:30 AM" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Time Out</label>
                            <input type="text" id="timeOut" placeholder="11:30 AM" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Comments</label>
                        <textarea id="comments" rows="2" class="payload-input w-full bg-white border border-gray-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:border-[#00508F] focus:ring-1 focus:ring-[#00508F]"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="submitBtn" class="bg-[#00508F] hover:bg-[#003d6e] text-white rounded-sm py-2 px-6 text-sm font-bold flex items-center justify-center gap-2 transition-colors w-full md:w-auto">
                            <i data-lucide="send" class="w-4 h-4"></i> Submit Attendance Data
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- RIGHT SIDEBAR: JSON Logs -->
        <div class="lg:col-span-4 space-y-5">
            
            <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[300px]">
                <div class="bg-[#E6EAF6] border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                    <h3 class="text-[#00508F] font-bold text-sm flex items-center gap-2">
                        <i data-lucide="code-2" class="w-4 h-4"></i> Payload Preview
                    </h3>
                    <span id="previewCountBadge" class="text-[10px] font-bold bg-[#00508F] text-white px-2 py-0.5 rounded-sm">1 PAYLOAD</span>
                </div>
                <div class="p-4 flex-1 overflow-auto bg-[#1e293b]">
                    <pre id="payloadPreview" class="text-emerald-400 text-[12px] font-mono leading-relaxed">{}</pre>
                </div>
            </div>

            <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[400px]">
                <div class="bg-[#E6EAF6] border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                    <h3 class="text-[#00508F] font-bold text-sm flex items-center gap-2">
                        <i data-lucide="server" class="w-4 h-4"></i> Execution Log
                    </h3>
                    <span id="responseStatus" class="text-[10px] font-bold bg-gray-500 text-white px-2 py-0.5 rounded-sm">WAITING</span>
                </div>
                <div class="p-4 flex-1 overflow-auto bg-[#1e293b]">
                    <pre id="responseLog" class="text-slate-400 text-[12px] font-mono leading-relaxed">// Submit request to view response...</pre>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // DOM Elements
        const authForm = document.getElementById('authForm');
        const authBtn = document.getElementById('authBtn');
        const tokenStatus = document.getElementById('tokenStatus');
        const step2Panel = document.getElementById('step2Panel');
        
        const payloadForm = document.getElementById('payloadForm');
        const submitBtn = document.getElementById('submitBtn');
        const payloadPreview = document.getElementById('payloadPreview');
        const responseLog = document.getElementById('responseLog');
        const responseStatus = document.getElementById('responseStatus');
        const previewCountBadge = document.getElementById('previewCountBadge');

        // --- Password Eye Toggle ---
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // --- Date Array Generator ---
        function getDatesBetween(startDateStr, endDateStr) {
            if (!endDateStr) return [startDateStr]; 
            const dates = [];
            let currentDate = new Date(startDateStr);
            const endDate = new Date(endDateStr);
            if (isNaN(currentDate) || isNaN(endDate) || currentDate > endDate) return [startDateStr];
            
            while (currentDate <= endDate) {
                const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dd = String(currentDate.getDate()).padStart(2, '0');
                const yyyy = currentDate.getFullYear();
                dates.push(`${mm}/${dd}/${yyyy}`);
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return dates;
        }

        function generatePayloadObject(specificDate) {
            return {
                serviceFormId: document.getElementById('serviceFormId').value || "",
                serviceDate: specificDate || document.getElementById('serviceDate').value || "",
                optionCode: document.getElementById('optionCode').value || "",
                timeInOut: [{
                    timeIn: document.getElementById('timeIn').value || "",
                    timeOut: document.getElementById('timeOut').value || "",
                    billable: true,
                    serviceType: 0
                }],
                comments: document.getElementById('comments').value || ""
            };
        }

        function updateLivePreview() {
            const startDate = document.getElementById('serviceDate').value;
            const endDate = document.getElementById('serviceDateEnd').value;
            const datesArray = getDatesBetween(startDate, endDate);
            
            previewCountBadge.textContent = `${datesArray.length} PAYLOAD${datesArray.length > 1 ? 'S' : ''}`;
            previewCountBadge.className = datesArray.length > 1 
                ? "text-[10px] font-bold bg-[#00508F] text-white px-2 py-0.5 rounded-sm"
                : "text-[10px] font-bold bg-gray-500 text-white px-2 py-0.5 rounded-sm";

            if (datesArray.length > 1) {
                const multiPayload = datesArray.map(d => generatePayloadObject(d));
                payloadPreview.textContent = JSON.stringify(multiPayload, null, 2);
            } else {
                const singlePayload = generatePayloadObject(startDate);
                payloadPreview.textContent = JSON.stringify(singlePayload, null, 2);
            }
        }

        document.querySelectorAll('.payload-input').forEach(input => {
            input.addEventListener('input', updateLivePreview);
        });
        updateLivePreview();

        // --- Step 1: Authentication ---
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Authenticating...';
            lucide.createIcons();
            authBtn.disabled = true;

            const credentials = {
                loginName: document.getElementById('loginName').value,
                providerCode: document.getElementById('providerCode').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });

                if (!res.ok) throw new Error("Login failed");

                tokenStatus.textContent = "ACTIVE";
                tokenStatus.className = "text-xs font-bold text-green-600 uppercase tracking-wider";
                authBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-green-600"></i> Authenticated';
                step2Panel.classList.remove('opacity-50', 'pointer-events-none');
                
            } catch (err) {
                alert(err.message);
                authBtn.innerHTML = '<i data-lucide="lock" class="w-4 h-4"></i> Authenticate API';
                authBtn.disabled = false;
            }
            lucide.createIcons();
        });

        // --- Step 2: Submit Payload(s) ---
        payloadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Submitting...';
            lucide.createIcons();
            submitBtn.disabled = true;

            const startDate = document.getElementById('serviceDate').value;
            const endDate = document.getElementById('serviceDateEnd').value;
            const datesToProcess = getDatesBetween(startDate, endDate);
            
            responseLog.innerHTML = `<span class="text-slate-400">[SYSTEM] Initiating bulk submit for ${datesToProcess.length} date(s)...\n\n</span>`;
            responseStatus.textContent = "PROCESSING...";
            responseStatus.className = "text-[10px] font-bold bg-[#00508F] text-white px-2 py-0.5 rounded-sm";

            let passCount = 0;
            let failCount = 0;

            for (let i = 0; i < datesToProcess.length; i++) {
                const dateStr = datesToProcess[i];
                const payload = generatePayloadObject(dateStr);
                
                try {
                    const res = await fetch('/api/submit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    
                    if (res.ok) {
                        passCount++;
                        responseLog.innerHTML += `<span class="text-emerald-400">✅ [${dateStr}] SUCCESS: \n${JSON.stringify(data, null, 2)}\n\n</span>`;
                    } else {
                        failCount++;
                        responseLog.innerHTML += `<span class="text-red-400">❌ [${dateStr}] ERROR (HTTP ${res.status}): \n${JSON.stringify(data, null, 2)}\n\n</span>`;
                    }
                } catch (err) {
                    failCount++;
                    responseLog.innerHTML += `<span class="text-red-500">❌ [${dateStr}] CRITICAL ERROR: ${err.message}\n\n</span>`;
                }
                responseLog.scrollTop = responseLog.scrollHeight;
            }

            if (failCount === 0) {
                responseStatus.textContent = "ALL SUCCESS";
                responseStatus.className = "text-[10px] font-bold bg-green-600 text-white px-2 py-0.5 rounded-sm";
            } else {
                responseStatus.textContent = `${failCount} ERROR(S)`;
                responseStatus.className = "text-[10px] font-bold bg-red-600 text-white px-2 py-0.5 rounded-sm";
            }

            responseLog.innerHTML += `<span class="text-slate-400">[SYSTEM] Finished. Passed: ${passCount} | Failed: ${failCount}</span>`;
            submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Submit Attendance Data';
            submitBtn.disabled = false;
            lucide.createIcons();
        });

       

        // --- Logout Logic ---
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const btn = document.getElementById('logoutBtn');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Logging out...';
            lucide.createIcons();
            
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (err) {
                console.error("Logout failed:", err);
            } finally {
                // Redirect the user to the actual Therap login page
                window.location.href = 'https://billing.therapdev.net/auth/login';
            }
        });
    </script>
</body>
</html>
